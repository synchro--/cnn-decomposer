site_name: TensorPress
site_description: Tensor factorization compression for convolutional neural networks
docs_dir: .
site_dir: ../site

theme:
  name: material
  palette:
    scheme: slate
    primary: cyan

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
      - Configuration: guide/config.md
      - Layer Selection: guide/layers.md
      - Rank Estimation: guide/ranks.md
      - Fine-Tuning: guide/finetune.md
  - API Reference:
      - Compressor: api/compressor.md
      - CompressConfig: api/config.md
      - CompressionResult: api/result.md
      - Decompositions: api/decompositions.md
  - Roadmap: roadmap.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
